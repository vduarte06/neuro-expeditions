[project]
name = "neuro-expeditions"
version = "0.1.0"
description = ""
authors = [
    {name = "Vinicius Duarte",email = "viniciusduarte06@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch (>=2.15.0,<3.0.0)",
    "transformers (>=5.22.1,<6.0.0)",
    "einops (>=0.8.2,<0.9.0)",
    "safetensors (>=0.8.0,<0.9.0)",
    "mne (>=1.13.2,<2.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "edfio (>=0.4.18,<0.5.0)",
    "epilepsy2bids (>=0.0.7,<0.0.8)",
    "braindecode (>=2.0.0,<3.0.0) ; python_version < \"3.14\""
]


[tool.poetry]
packages = [{ include = "neuro_expeditions", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "nbformat (>=5.11.1,<6.0.0)"
]
